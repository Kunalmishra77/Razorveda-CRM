name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Cancel an in-flight run when a newer commit arrives, so a burst of pushes does
# not produce a burst of failure emails.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # @embedded-postgres/windows-x64 is an OPTIONAL dependency: it is a Windows
      # development convenience for running Postgres without Docker, and npm
      # correctly skips it on Linux. As a hard dependency it made `npm ci` fail on
      # ubuntu-latest, which is how the first version of this workflow managed to
      # fail both jobs inside twenty-five seconds.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # 597 tests across the four workspaces. None of these need a database.
      - name: Unit tests
        run: npm test

      # apps/web was typechecked but never BUILT. tsc does not run the bundler,
      # so a broken import path, an invalid route export, or a client component
      # importing server-only code all typecheck cleanly and fail at build - which
      # would first be discovered on the VPS, during a deploy.
      #
      # 13 routes, no database needed: nothing fetches at build time.
      - name: Web production build
        run: npm run build -w @razorveda/web

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci

      # ENFORCING AT CRITICAL, REPORTING BELOW IT.
      #
      # This was `|| true` on everything, with a note saying "make it enforcing
      # once the tree is clean". The tree is now clean enough to ratchet: 18
      # advisories down to 5, critical 1 -> 0 (D-240).
      #
      # Critical FAILS the build. There are none today, so this is green now and
      # goes red the moment one appears — which is the only kind of threshold
      # worth setting. A gate that is already failing when you add it teaches
      # people to ignore it, and that is what the previous version was avoiding.
      #
      # High and moderate still report without failing, because the three highs
      # that remain are unreachable and their reasoning is written down in
      # docs/10-dependency-risk.md — postcss and sharp reached only through Next,
      # neither on any path our code executes. Failing on those would mean
      # a permanently red pipeline over findings we have already accounted for.
      # The reachability claims are enforced as TESTS, not left as prose:
      # apps/api/test/dependency-reachability.test.ts goes red if anyone adds
      # next/image, a multipart handler, or a direct uuid call.
      - name: Dependency audit (critical fails, rest reports)
        run: npm audit --audit-level=critical

      - name: Dependency audit (full report)
        if: always()
        run: |
          npm audit --audit-level=moderate || true
          npm audit --json > audit.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit
          path: audit.json

  # THE WEB LAYER, WHICH HAD NO BEHAVIOURAL COVERAGE AT ALL.
  #
  # Twelve routes, typechecked and built, with nothing exercising them. Everything
  # else in this pipeline proves the API or the database: RLS isolation, the money
  # rules, the metric definitions. All of that can be perfectly correct while the
  # login form posts to the wrong path, the session cookie is dropped, or the
  # worklist renders an error because a field was renamed on the server.
  #
  # Four tests, covering the seams between the browser and the API and stopping
  # there. The first run found a real defect: a rep who opened /security was served
  # the complete admin shell, nav and all, with empty tables and no explanation.
  #
  # A SEPARATE JOB rather than bolted onto rls, so a browser failure is never
  # mistaken for an isolation failure, and so the two run in parallel.
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: razorveda_migrator
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: razorveda
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U razorveda_migrator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://razorveda_migrator:localdev@localhost:5433/razorveda
      DATABASE_URL_APP: postgresql://razorveda_app:localdev@localhost:5433/razorveda
      JWT_SECRET: ci-only-secret-value-at-least-32-characters-long
      RATE_LIMIT_DISABLED: '1'
      SCHEDULER_DISABLED: '1'
      NEXT_PUBLIC_API_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci

      - name: Migrate and seed
        run: |
          npm run db:migrate
          npm run db:seed
          npm run db:seed:dev

      # Chromium only. Firefox and WebKit would triple the download to re-test the
      # same four seams in browsers the client's team does not use.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build web
        run: npm run build -w @razorveda/web

      - name: E2E
        run: |
          (cd apps/api && node ../../node_modules/tsx/dist/cli.mjs src/main.ts > /tmp/api.log 2>&1 &)
          (cd apps/web && node ../../node_modules/next/dist/bin/next start -p 3000 > /tmp/web.log 2>&1 &)
          for i in $(seq 1 90); do
            a=$(curl -s -m 2 -o /dev/null -w "%{http_code}" http://localhost:3001/health || true)
            w=$(curl -s -m 2 -o /dev/null -w "%{http_code}" http://localhost:3000/login || true)
            if [ "$a" = "200" ] && [ "$w" = "200" ]; then break; fi
            sleep 1
          done
          if [ "$a" != "200" ] || [ "$w" != "200" ]; then
            echo "api=$a web=$w"; echo '--- api ---'; cat /tmp/api.log; echo '--- web ---'; cat /tmp/web.log; exit 1
          fi
          npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # THE TESTS THAT HAVE ACTUALLY CAUGHT THINGS.
  #
  # This job was absent for a while, and the note in its place said so honestly:
  # the first version of this file added it without being able to run GitHub
  # Actions locally, it failed on every push, and it emailed the repository owner
  # each time. "A green pipeline that runs less is worth more than a red one that
  # claims more" was the right call at the time.
  #
  # What changed is that the whole sequence was rehearsed end to end against an
  # empty database first, and rehearsing it found two defects that 681 tests and
  # every previous CI run had missed - db/schema.sql could not be applied to a
  # fresh database at all (D-248). That is precisely the class of bug a job like
  # this exists to catch, and it was sitting in the repo the entire time the job
  # was missing.
  #
  # It BUILDS FROM EMPTY on every push. That is the point. A migration that only
  # works on a database which already has the table is not a migration.
  rls:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          # Naming the superuser here means no bootstrap psql step: the container
          # creates exactly the role the migrator expects.
          POSTGRES_USER: razorveda_migrator
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: razorveda
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U razorveda_migrator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # localhost is in the LOCAL_HOSTS allowlist in packages/db/src/env.ts, so
      # assertLocalTarget permits this. D-17 holds: CI runs against its own
      # throwaway Postgres and never against Coolify. There is no credential here
      # that could reach it even by accident.
      DATABASE_URL: postgresql://razorveda_migrator:localdev@localhost:5433/razorveda
      DATABASE_URL_APP: postgresql://razorveda_app:localdev@localhost:5433/razorveda
      JWT_SECRET: ci-only-secret-value-at-least-32-characters-long
      RATE_LIMIT_DISABLED: '1'
      # The scheduler is ON by default, on purpose. It must be OFF here: this job
      # starts a real API alongside a suite that includes an untouched-recall test,
      # and a genuine 72h recall firing underneath it would return leads mid-test
      # and present as an intermittently failing security test. A flaky security
      # test is worse than a slow one - it gets re-run until it passes.
      SCHEDULER_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci

      # pg_dump for the restore drill. The runner image ships a client, but not
      # necessarily 16 - and a client older than the server refuses the dump.
      - name: Install postgresql-client-16
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          pg_dump --version

      # From nothing to correct, in the same order a new environment would.
      - name: Migrate (from an EMPTY database)
        run: npm run db:migrate

      - name: Seed master data
        run: npm run db:seed

      # NOT OPTIONAL, and not obvious. seed:dev is what creates two reps holding
      # different leads and a customer belonging to neither. Without it every
      # isolation assertion passes VACUOUSLY - a rep who can see nothing looks
      # exactly like a rep who is correctly scoped, and the suite goes green while
      # proving nothing at all.
      - name: Seed cross-rep fixture
        run: npm run db:seed:dev

      # API and suite in ONE step, deliberately. Split across steps, the wait loop
      # can pass against a process that is about to exit, and the failure then
      # surfaces as an unrelated connection error in the next step.
      - name: RLS isolation suite (87 tests)
        run: |
          # Started from apps/api, which is exactly how the sequence was
          # rehearsed locally. main.ts reads nothing relative to cwd today, but
          # matching the rehearsal costs nothing and removes a variable.
          (cd apps/api && node ../../node_modules/tsx/dist/cli.mjs src/main.ts > /tmp/api.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf http://localhost:3001/health >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3001/health || { echo "API never came up:"; cat /tmp/api.log; exit 1; }
          npm run test:rls

      # Restores into a scratch database and checks that RLS, the append-only
      # triggers, the SECURITY DEFINER functions and actual rep isolation all
      # survive the round trip. A backup that restores without its policies is a
      # data breach with a recovery-time objective attached.
      - name: Restore drill
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
          PGHOST: localhost
          PGPORT: '5433'
          PGUSER: razorveda_migrator
          PGPASSWORD: localdev
          PGDATABASE: razorveda
        run: npm run db:restore-drill

      - name: API log
        if: failure()
        run: cat /tmp/api.log || true
