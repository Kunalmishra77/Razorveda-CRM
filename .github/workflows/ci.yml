name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Cancel an in-flight run when a newer commit arrives, so a burst of pushes does
# not produce a burst of failure emails.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # @embedded-postgres/windows-x64 is an OPTIONAL dependency: it is a Windows
      # development convenience for running Postgres without Docker, and npm
      # correctly skips it on Linux. As a hard dependency it made `npm ci` fail on
      # ubuntu-latest, which is how the first version of this workflow managed to
      # fail both jobs inside twenty-five seconds.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # 594 tests across the four workspaces. None of these need a database.
      - name: Unit tests
        run: npm test

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci

      # ENFORCING AT CRITICAL, REPORTING BELOW IT.
      #
      # This was `|| true` on everything, with a note saying "make it enforcing
      # once the tree is clean". The tree is now clean enough to ratchet: 18
      # advisories down to 5, critical 1 -> 0 (D-240).
      #
      # Critical FAILS the build. There are none today, so this is green now and
      # goes red the moment one appears — which is the only kind of threshold
      # worth setting. A gate that is already failing when you add it teaches
      # people to ignore it, and that is what the previous version was avoiding.
      #
      # High and moderate still report without failing, because the three highs
      # that remain are unreachable and their reasoning is written down in
      # docs/10-dependency-risk.md — postcss and sharp reached only through Next,
      # neither on any path our code executes. Failing on those would mean
      # a permanently red pipeline over findings we have already accounted for.
      # The reachability claims are enforced as TESTS, not left as prose:
      # apps/api/test/dependency-reachability.test.ts goes red if anyone adds
      # next/image, a multipart handler, or a direct uuid call.
      - name: Dependency audit (critical fails, rest reports)
        run: npm audit --audit-level=critical

      - name: Dependency audit (full report)
        if: always()
        run: |
          npm audit --audit-level=moderate || true
          npm audit --json > audit.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit
          path: audit.json

# NOT HERE, AND ON PURPOSE: the live database suite (test:rls) and the restore
# drill. They are the tests that have actually caught things in this project —
# the eight isolation tests, the adversarial security review, the RLS coverage
# guard, the velocity lock, the fan-out guard — and they belong in CI.
#
# They are absent because the first version of this file added them without being
# able to run GitHub Actions locally, and it failed on every push and emailed the
# repository owner each time. Adding them back needs, and needs verifying:
#
#   services: postgres:16 mapped to 5433
#   apt-get install postgresql-client-16   (pg_dump for the restore drill)
#   DATABASE_URL / DATABASE_URL_APP / JWT_SECRET in env
#   the API started in the background before test:rls
#
# A green pipeline that runs less is worth more than a red one that claims more.
