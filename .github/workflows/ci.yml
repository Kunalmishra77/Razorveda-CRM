name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # A real Postgres, because more than half of this project's defects lived in
    # SQL and RLS and were invisible to a unit test. The live suite is not
    # optional here (D-17: dev and CI use local Postgres in Docker, never Coolify).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: razorveda_migrator
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: razorveda
        ports: ['5433:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://razorveda_migrator:localdev@127.0.0.1:5433/razorveda
      DATABASE_URL_APP: postgresql://razorveda_app:localdev@127.0.0.1:5433/razorveda
      JWT_SECRET: ci-only-secret-at-least-thirty-two-characters-long
      NOTIFY_DIR: .digests

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build the database
        run: |
          npx tsx packages/db/src/migrate.ts --fresh
          npx tsx packages/db/src/seed.ts
          npx tsx packages/db/src/seed-dev-fixture.ts

      - name: Start the API
        run: |
          npx tsx apps/api/src/main.ts &
          for i in $(seq 1 60); do curl -sf http://localhost:3001/health && break; sleep 1; done

      # The eight isolation tests, the adversarial security review, the RLS
      # coverage guard, the velocity lock and the fan-out guard. These are the
      # tests that have actually caught things.
      - name: Live database and security tests
        run: npm run test:rls

      - name: Restore drill
        run: npx tsx packages/db/src/restore-drill.ts
        env:
          PG_BIN: /usr/lib/postgresql/16/bin

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci

      # Reported, not enforced — deliberately, and this is the honest position.
      #
      # The tree currently carries 15 findings this project did not choose,
      # including a high in `multer` reached through @nestjs/platform-express on
      # the upload path (D-170). Failing the build on `npm audit` today would mean
      # a permanently red pipeline that everyone learns to ignore, which is worse
      # than a report someone reads.
      #
      # Turn `continue-on-error` off once the tree is clean. That is the whole
      # remediation plan: fix them, then make it enforcing.
      - name: Dependency audit
        continue-on-error: true
        run: npm audit --audit-level=moderate

      - name: Audit summary
        if: always()
        run: npm audit --json > audit.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit
          path: audit.json
