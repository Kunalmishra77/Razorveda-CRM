# THE DEPLOYED STACK. Point Coolify at this file, not at docker-compose.yml —
# that one is local development infrastructure only (D-17) and publishes the
# database on a host port, which must never happen on a server.
#
# Six services. One Postgres, one Redis, one API, one worker, one web, plus a
# migrate job that runs to completion before the API is allowed to start.
# CLAUDE.md rule 9: no Kubernetes, no message bus, no second database.
#
# NOTHING HERE PUBLISHES A DATABASE PORT. Postgres, Redis and MinIO are reachable
# only on the internal compose network; Coolify's proxy terminates TLS and routes
# to `web` and `api` by the domains you set in its UI.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # razorveda_migrator OWNS the tables. The API never connects as this role —
      # owners bypass RLS (D-21), which would silently disable every isolation
      # policy in the product.
      POSTGRES_USER: razorveda_migrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD}
      POSTGRES_DB: razorveda
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U razorveda_migrator -d razorveda']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Runs to completion on every deploy, before the API starts. Both halves are
  # idempotent — migrate creates what is missing, seed upserts the master data —
  # so a redeploy is safe and a schema change lands automatically.
  migrate:
    build:
      context: .
      args:
        APP: migrate
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://razorveda_migrator:${POSTGRES_PASSWORD}@postgres:5432/razorveda
      # Creates the non-owning login role the API uses. Must match the password
      # inside DATABASE_URL_APP below or the API cannot connect.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
      TZ: Asia/Kolkata
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      args:
        APP: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: Asia/Kolkata
      API_PORT: 3001
      # TWO URLS, ON PURPOSE. See the note on the postgres service.
      DATABASE_URL: postgresql://razorveda_migrator:${POSTGRES_PASSWORD}@postgres:5432/razorveda
      DATABASE_URL_APP: postgresql://razorveda_app:${APP_DB_PASSWORD}@postgres:5432/razorveda
      DATABASE_APP_ROLE: app_role
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-razorveda-uploads}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-ap-south-1}
      JWT_SECRET: ${JWT_SECRET:?set a 64-character random JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      SESSION_IDLE_TIMEOUT_MIN: ${SESSION_IDLE_TIMEOUT_MIN:-10}
      OWNER_CLAIM_TOKEN: ${OWNER_CLAIM_TOKEN}
      # The browser origin the API will accept and echo CORS for. Must be the
      # https domain you gave the `web` service in Coolify, with no trailing slash.
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN to the public URL of the web app}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL:-gemini-2.0-flash}
      AI_MAPPING_MIN_CONFIDENCE: ${AI_MAPPING_MIN_CONFIDENCE:-0.90}
      PII_COPY_VELOCITY_COUNT: ${PII_COPY_VELOCITY_COUNT:-4}
      PII_COPY_VELOCITY_WINDOW_SEC: ${PII_COPY_VELOCITY_WINDOW_SEC:-90}
      UNTOUCHED_ALERT_HOURS: ${UNTOUCHED_ALERT_HOURS:-48}
      UNTOUCHED_RECALL_HOURS: ${UNTOUCHED_RECALL_HOURS:-72}
      EMPLOYEE_MAX_ROWS_PER_PAGE: ${EMPLOYEE_MAX_ROWS_PER_PAGE:-50}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER}
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      args:
        APP: worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: Asia/Kolkata
      DATABASE_URL_APP: postgresql://razorveda_app:${APP_DB_PASSWORD}@postgres:5432/razorveda
      DATABASE_APP_ROLE: app_role
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-razorveda-uploads}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      args:
        APP: web
        # BUILD-TIME, not runtime. Next inlines NEXT_PUBLIC_* into the browser
        # bundle when it builds; setting it only at runtime leaves every rep's
        # browser calling http://localhost:3001. This is the mistake that makes a
        # Next deploy look completely broken with no error in any log.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL to the public URL of the api}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: Asia/Kolkata
      PORT: 3000
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  miniodata:
